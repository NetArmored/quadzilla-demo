<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0d12">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Quadzilla">
  <meta name="application-name" content="Quadzilla">
  <title>Quadzilla (Demo)</title>
  <meta name="robots" content="noindex">
  <style>
    :root {
      --bg: #0b0d12;
      --bg-2: #10131a;
      --surface: #161a23;
      --surface-2: #1d2230;
      --line: #2a3142;
      --ink: #f4f6fb;
      --muted: #9aa3b8;
      --faint: #6b7388;
      --accent: #3dffb0;
      --accent-ink: #042016;
      --accent-dim: rgba(61, 255, 176, 0.16);
      --accent-glow: rgba(61, 255, 176, 0.55);
      --warn: #ffc857;
      --warn-dim: rgba(255, 200, 87, 0.14);
      --danger: #ff7a86;
      --danger-dim: rgba(255, 122, 134, 0.14);
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, Roboto, sans-serif;
      --radius: 20px;
      --safe-t: max(16px, env(safe-area-inset-top));
      --safe-b: max(16px, env(safe-area-inset-bottom));
      --safe-x: max(16px, env(safe-area-inset-left), env(safe-area-inset-right));
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font);
      -webkit-tap-highlight-color: transparent; overflow: hidden; overscroll-behavior: none;
      user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-user-drag: none;
      touch-action: manipulation;
    }
    .app { height: 100%; overflow: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
    input, textarea { user-select: text; -webkit-user-select: text; touch-action: manipulation; }
    button, input { font-family: inherit; color: inherit; }
    button { cursor: pointer; }
    button:disabled { opacity: 0.4; cursor: default; }
    h1, h2, h3, p { margin: 0; }
    .app { max-width: 980px; margin: 0 auto; height: 100%; overflow: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: var(--safe-t) var(--safe-x) calc(var(--safe-b) + 24px); }
    header.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
    .brand-kicker { color: var(--accent); font-size: 11px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; margin-bottom: 8px; }
    h1 { font-size: 28px; letter-spacing: -0.03em; font-weight: 700; }
    .wordmark {
      display: flex; flex-direction: column; align-items: flex-start; gap: 8px; margin: 0;
    }
    .wordmark-text {
      font-size: clamp(44px, 9vw, 72px); font-weight: 900; letter-spacing: -0.08em; line-height: 0.82;
      text-transform: uppercase; color: var(--ink);
      text-shadow: 0 0 18px var(--accent-glow), 0 0 42px rgba(61, 255, 176, 0.25);
    }
    .wordmark-text span { color: var(--accent); }
    .quad-dots { display: flex; gap: 6px; }
    .quad-dots i { width: 11px; height: 11px; border-radius: 3px; background: var(--accent); box-shadow: 0 0 10px var(--accent-glow); display: block; }
    .sub { color: var(--muted); margin-top: 10px; font-size: 15px; max-width: 46ch; line-height: 1.4; }
    .board-title {
      font-size: clamp(26px, 5vw, 36px); font-weight: 900; letter-spacing: -0.05em; text-transform: uppercase;
      color: var(--accent); text-shadow: 0 0 16px var(--accent-glow); margin: 0 0 16px;
    }
    .badge { display: inline-flex; align-items: center; height: 28px; padding: 0 10px; border-radius: 999px; background: var(--warn-dim); color: var(--warn); font-size: 11px; font-weight: 700; letter-spacing: 0.06em; }
    .nav { display: flex; gap: 8px; padding: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; margin-bottom: 22px; }
    .nav button { flex: 1; min-height: 48px; border: 0; border-radius: 12px; background: transparent; color: var(--muted); font-size: 16px; font-weight: 650; }
    .nav button.on { background: var(--surface-2); color: var(--ink); }
    .quiet { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 12px; min-height: 44px; padding: 0 14px; font-size: 15px; font-weight: 600; }
    .mic-stage { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 12px 8px 28px; }
    .mic-hint { color: var(--muted); font-size: 18px; margin-bottom: 6px; }
    .mic-ex { color: var(--faint); font-size: 15px; margin-bottom: 28px; }
    .mic-ex strong { color: var(--ink); font-weight: 650; }
    .mic { appearance: none; width: 196px; height: 196px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; box-shadow: 0 0 0 12px var(--accent-dim), 0 18px 50px var(--accent-glow); transition: transform 0.15s ease; }
    .mic:active { transform: scale(0.97); }
    .mic.listening { background: var(--ink); animation: pulse 1.2s ease-in-out infinite; box-shadow: 0 0 0 16px var(--accent-dim), 0 0 80px var(--accent-glow); }
    .mic svg { width: 72px; height: 72px; display: block; }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    .listen-label { margin-top: 22px; font-size: 20px; font-weight: 650; min-height: 28px; }
    .listen-label.live { color: var(--accent); }
    .transcript { margin-top: 8px; color: var(--muted); font-size: 18px; min-height: 28px; }
    .note { margin: 18px 0 0; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; color: var(--muted); font-size: 14px; line-height: 1.45; text-align: left; max-width: 560px; }
    .note.warn { background: var(--warn-dim); border-color: transparent; color: var(--warn); }
    .typebox { width: 100%; max-width: 640px; margin: 28px auto 0; text-align: left; }
    .typebox label { display: block; color: var(--faint); font-size: 13px; font-weight: 650; letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 8px; }
    .type-row { display: flex; gap: 10px; }
    .type-row input { flex: 1; min-height: 56px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); padding: 0 16px; font-size: 18px; }
    .type-row input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .go { appearance: none; min-width: 88px; border: 0; border-radius: 16px; background: var(--surface-2); font-size: 17px; font-weight: 700; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .chip { appearance: none; border: 1px solid var(--line); background: var(--bg-2); color: var(--muted); border-radius: 999px; padding: 10px 14px; font-size: 14px; }
    .search { width: 100%; min-height: 56px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); padding: 0 16px; font-size: 18px; margin-bottom: 14px; }
    .player-row, .pick-btn { appearance: none; width: 100%; display: flex; align-items: center; gap: 14px; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 18px; padding: 14px 16px; margin-bottom: 10px; min-height: 76px; }
    .pick-btn { min-height: 88px; font-size: 22px; font-weight: 700; }
    .avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--accent-dim); color: var(--accent); display: grid; place-items: center; font-weight: 700; flex: none; }
    .pick-btn .avatar { width: 56px; height: 56px; font-size: 18px; }
    .who { flex: 1; }
    .who .name { font-size: 18px; font-weight: 700; }
    .who .meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
    .pct { font-size: 18px; font-weight: 700; color: var(--accent); }
    .back { appearance: none; border: 0; background: transparent; color: var(--accent); font-size: 16px; font-weight: 650; padding: 0 0 14px; }
    .detail-head { display: flex; align-items: center; gap: 22px; margin: 8px 0 22px; }
    .ring-wrap { position: relative; width: 148px; height: 148px; flex: none; }
    .ring-wrap svg { width: 148px; height: 148px; transform: rotate(-90deg); }
    .ring-label { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
    .ring-label b { font-size: 32px; letter-spacing: -0.03em; }
    .ring-label span { color: var(--muted); font-size: 13px; }
    .need { color: var(--muted); margin-bottom: 18px; font-size: 16px; }
    .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
    .rank { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--faint); border-radius: 14px; min-height: 68px; font-weight: 700; font-size: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .rank small { font-size: 10px; font-weight: 500; color: var(--faint); margin-top: 2px; }
    .rank.filled { background: var(--accent-dim); color: var(--accent); border-color: transparent; }
    .rank.filled small { color: var(--muted); }
    .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 18px; }
    .metric { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
    .metric .n { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .metric .l { color: var(--muted); font-size: 13px; margin-top: 2px; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin-bottom: 14px; }
    .card h2 { font-size: 18px; margin-bottom: 10px; }
    .card ul { margin: 0; padding-left: 18px; color: var(--muted); }
    .card li { margin: 0 0 6px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); }
    th { color: var(--faint); font-weight: 600; font-size: 12px; }
    .sorts { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .activity { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; margin-bottom: 10px; }
    .activity .title { font-weight: 700; }
    .activity .meta { color: var(--muted); font-size: 13px; margin-top: 3px; }
    .flag { display: inline-block; margin-top: 6px; color: var(--warn); font-size: 13px; font-weight: 650; }
    .undo-btn { appearance: none; border: 0; background: var(--danger-dim); color: var(--danger); border-radius: 12px; min-height: 48px; padding: 0 16px; font-weight: 700; flex: none; }
    .primary { appearance: none; border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 16px; min-height: 56px; padding: 0 18px; font-size: 18px; font-weight: 800; width: 100%; }
    .scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.62); display: flex; align-items: flex-end; justify-content: center; z-index: 40; padding: 16px 16px calc(var(--safe-b) + 16px); }
    .sheet { width: min(560px, 100%); background: var(--surface-2); border: 1px solid var(--line); border-radius: 28px; padding: 28px 24px 22px; text-align: center; }
    .sheet .who-name { font-size: 26px; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 6px; }
    .sheet .rank-hero { font-size: 132px; line-height: 0.9; font-weight: 800; letter-spacing: -0.06em; color: var(--accent); padding: 8px 0 18px; }
    .sheet .ok { appearance: none; width: 100%; border: 0; border-radius: 18px; min-height: 72px; background: var(--accent); color: var(--accent-ink); font-size: 28px; font-weight: 800; }
    .sheet .cancel { appearance: none; border: 0; background: transparent; color: var(--muted); min-height: 48px; margin-top: 10px; font-size: 16px; font-weight: 600; width: 100%; }
    .sheet .dup { background: var(--warn-dim); color: var(--warn); border-radius: 12px; padding: 10px 12px; margin-bottom: 16px; font-size: 14px; font-weight: 650; }
    .sheet h2 { font-size: 22px; margin-bottom: 16px; }
    .toast { position: fixed; left: 50%; bottom: calc(var(--safe-b) + 28px); transform: translateX(-50%); background: var(--ink); color: var(--bg); border-radius: 999px; padding: 14px 22px; font-size: 18px; font-weight: 800; z-index: 60; }
    .foot { color: var(--faint); font-size: 13px; line-height: 1.5; margin-top: 28px; }

    .verified, .unverified, .ai-badge, .suite-badge {
      display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; margin-right: 6px;
      border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 700;
    }
    .verified { background: var(--accent-dim); color: var(--accent); border: 0; }
    .rejected { background: var(--danger-dim); color: var(--danger); }
    .stamp {
      display: inline-flex; flex-direction: column; align-items: flex-start; gap: 2px;
      margin-top: 8px; margin-right: 6px; border: 2px solid var(--accent); color: var(--accent);
      background: var(--accent-dim); border-radius: 10px; padding: 6px 10px; text-align: left;
      transform: rotate(-2deg); max-width: 100%;
    }
    .stamp .stamp-mark { font-size: 13px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; }
    .stamp .stamp-meta { font-size: 11px; font-weight: 650; color: var(--ink); opacity: 0.9; text-transform: none; letter-spacing: 0; }
    .stamp.no { border-color: var(--danger); color: var(--danger); background: var(--danger-dim); transform: rotate(2deg); }
    .stamp.no .stamp-meta { color: var(--danger); }
    .stamp.bypass { border-color: var(--warn); color: var(--warn); background: var(--warn-dim); transform: rotate(1deg); }
    .stamp.bypass .stamp-meta { color: var(--warn); }
    .sheet .bypass-btn {
      appearance: none; width: 100%; border: 1px solid var(--warn); border-radius: 16px;
      min-height: 52px; margin-top: 10px; background: var(--warn-dim); color: var(--warn);
      font-size: 16px; font-weight: 700;
    }
    .sheet-field { text-align: left; margin: 0 0 12px; }
    .sheet-field label { display: block; color: var(--faint); font-size: 13px; font-weight: 650; letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 8px; }
    .sheet-field input { width: 100%; min-height: 52px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); padding: 0 14px; font-size: 17px; }
    .sheet-field input:focus { outline: 2px solid var(--warn); outline-offset: 1px; }
    .success-screen.bypass .rank-hero { color: var(--warn); text-shadow: 0 0 28px rgba(255, 200, 87, 0.45); }
    .success-screen.bypass .countdown-bar { background: var(--warn); box-shadow: 0 0 18px rgba(255, 200, 87, 0.55); }
    .mgr-tabs { display: flex; gap: 8px; padding: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; margin-bottom: 18px; }
    .mgr-tabs button { flex: 1; min-height: 44px; border: 0; border-radius: 12px; background: transparent; color: var(--muted); font-size: 15px; font-weight: 650; }
    .mgr-tabs button.on { background: var(--surface-2); color: var(--ink); }
    .bypass-count { color: var(--warn); font-weight: 800; }
    .bypass-player-row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); text-align: left; }
    .bypass-player-row.heavy { background: var(--warn-dim); margin: 0 -12px; padding: 10px 12px; border-radius: 10px; border-bottom: 0; }
    .bypass-entry { padding: 12px 0; border-bottom: 1px solid var(--line); text-align: left; }
    .bypass-entry .title { font-weight: 700; }
    .bypass-entry .meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .unverified { background: var(--warn-dim); color: var(--warn); }
    .ai-badge { background: #2a3142; color: var(--muted); }
    .ai-badge.mismatch { background: var(--danger-dim); color: var(--danger); }
    .suite-badge { background: var(--warn-dim); color: var(--warn); }
    .suite-badge.ok { background: var(--accent-dim); color: var(--accent); }
    .thumb, .proof-thumb {
      width: 56px; height: 56px; object-fit: cover; border-radius: 10px; flex: none;
      border: 1px solid var(--line); background: var(--bg); cursor: pointer;
    }
    .proof-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); text-align: left; }
    .photo-preview { width: 100%; max-height: 180px; object-fit: cover; border-radius: 14px; margin: 0 0 10px; }
    .confirm-extra { text-align: left; margin: 0 0 14px; }
    .sheet .ok:disabled { opacity: 0.35; }
    .sheet.wide { width: min(640px, 100%); }
    .viewfinder { position: relative; width: 100%; aspect-ratio: 4 / 3; background: #05060a; border-radius: 18px; overflow: hidden; margin: 8px 0 12px; }
    .viewfinder video, .viewfinder canvas { width: 100%; height: 100%; object-fit: cover; display: block; }
    .demo-tag { position: absolute; top: 12px; left: 12px; z-index: 2; background: var(--warn); color: #111; font-weight: 800; letter-spacing: 0.08em; font-size: 12px; padding: 6px 10px; border-radius: 8px; }
    .scan-box { padding: 36px 12px; }
    .scan-dot { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); margin: 0 auto 16px; animation: pulse 1s ease-in-out infinite; }
    .result-card { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin: 8px 0 16px; }
    .result-card .row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
    .result-card .row:last-child { border-bottom: 0; }
    .result-card .k { color: var(--faint); }
    .result-card .v { font-weight: 700; }
    .fail-choices { display: flex; flex-direction: column; gap: 8px; margin: 0 0 12px; }
    .rejected { background: var(--danger-dim); color: var(--danger); }
    .pin-dots { display: flex; justify-content: center; gap: 12px; margin: 8px 0 18px; }
    .pin-dots span { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); background: transparent; }
    .pin-dots span.on { background: var(--accent); border-color: var(--accent); }
    .pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 0 0 12px; }
    .pin-pad button { appearance: none; min-height: 64px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 16px; font-size: 24px; font-weight: 800; }
    .lock-chip { display: inline-flex; align-items: center; height: 28px; padding: 0 10px; border-radius: 999px; background: var(--surface); color: var(--muted); border: 1px solid var(--line); font-size: 11px; font-weight: 700; letter-spacing: 0.04em; }
    .success-screen {
      position: fixed; inset: 0; z-index: 80;
      background: var(--bg);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: var(--safe-t) var(--safe-x) calc(var(--safe-b) + 32px);
      cursor: pointer;
    }
    .success-screen .who-name { font-size: clamp(28px, 6vw, 48px); font-weight: 800; letter-spacing: -0.04em; margin-bottom: 4px; }
    .success-screen .rank-hero { font-size: clamp(120px, 28vw, 200px); line-height: 0.88; font-weight: 800; letter-spacing: -0.07em; color: var(--accent); text-shadow: 0 0 28px var(--accent-glow); padding: 8px 0 18px; }
    .success-screen .stamp { transform: none; margin: 8px auto 0; padding: 12px 16px; align-items: center; }
    .success-screen .stamp-mark { font-size: 22px; }
    .success-screen .stamp-meta { font-size: 14px; }
    .countdown-track { width: min(440px, 86vw); height: 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; margin-top: 36px; }
    .countdown-bar { height: 100%; width: 100%; background: var(--accent); box-shadow: 0 0 18px var(--accent-glow); transform-origin: left center; animation: drain 10s linear forwards; }
    @keyframes drain { from { transform: scaleX(1); } to { transform: scaleX(0); } }
    .fail-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
    .success-screen .need { margin-top: 18px; }
    .success-photo { width: min(420px, 72vw); max-height: 28vh; object-fit: contain; border-radius: 16px; margin: 6px 0 10px; border: 1px solid var(--line); background: #05060a; }
    .rotate-btn { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 14px; min-height: 52px; padding: 0 16px; font-size: 16px; font-weight: 700; width: 100%; margin: 8px 0; }
    .success-screen .rotate-btn { width: auto; min-width: 160px; margin: 8px auto 0; }
    .toggle-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--line); }
    .toggle-row h3 { font-size: 16px; margin-bottom: 4px; }
    .toggle-row p { color: var(--muted); font-size: 13px; line-height: 1.4; }
    .switch { appearance: none; flex: none; width: 52px; height: 32px; border: 0; border-radius: 999px; background: #2a3142; position: relative; }
    .switch.on { background: var(--accent); }
    .switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: left 0.15s ease; }
    .switch.on::after { left: 24px; }
    .viewer { width: min(720px, 100%); }
    .viewer img { width: 100%; border-radius: 16px; margin: 10px 0 12px; }
    .mgr { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    @media (max-width: 700px) {
      .metrics { grid-template-columns: 1fr 1fr; }
      .sheet .rank-hero { font-size: 108px; }
      .mic { width: 168px; height: 168px; }
      .nav button { font-size: 14px; }
      .wordmark-text { font-size: clamp(40px, 12vw, 56px); }
    }

    [hidden] { display: none !important; }
    .login-gate {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--safe-t) var(--safe-x) var(--safe-b);
    }
    .login-card {
      width: min(420px, 100%);
      background: var(--surface);

      if (!bind) return;
      ui[bind] = el.value;
      if (bind === "query") render();
    });
    document.addEventListener("keydown", function (event) {
      if (event.key === "Enter" && event.target && event.target.getAttribute("data-bind") === "typed") {
        event.preventDefault();
        if (ui.typed.trim()) handlePhrase(ui.typed.trim());
      }
      if (event.key === "Enter" && event.target && event.target.getAttribute("data-sheet") && ui.sheet && ui.sheet.kind === "bypass-confirm") {
        event.preventDefault();
        confirmBypass();
      }
      if (ui.sheet && ui.sheet.kind === "pin") {
        if (/^[0-9]$/.test(event.key)) {
          event.preventDefault();
          if ((ui.sheet.pin || "").length < 4) ui.sheet.pin = (ui.sheet.pin || "") + event.key;
          ui.sheet.error = "";
          if (ui.sheet.pin.length >= 4) submitPin();
          else render();
        } else if (event.key === "Backspace") {
          event.preventDefault();
          ui.sheet.pin = (ui.sheet.pin || "").slice(0, -1);
          render();
        } else if (event.key === "Enter") {
          event.preventDefault();
          submitPin();
        }
      }
    });
    function installKiosk() {
      try {
        var manifest = {
          name: "Quadzilla",
          short_name: "Quadzilla",
          display: "standalone",
          background_color: "#0b0d12",
          theme_color: "#0b0d12",
          start_url: ".",
          orientation: "any"
        };
        var existing = document.querySelector('link[rel="manifest"]');
        if (!existing) {
          var link = document.createElement("link");
          link.rel = "manifest";
          link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" }));
          document.head.appendChild(link);
        }
      } catch (err) {}
      ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
        document.addEventListener(ev, function (e) { e.preventDefault(); }, { passive: false });
      });
      document.addEventListener("touchmove", function (e) {
        if (e.touches && e.touches.length > 1) e.preventDefault();
      }, { passive: false });
    }
    installKiosk();
    QuadzillaAuth.bind(function () { render(); });
  })();
  </script>
</body>
